# Construit la documentation MkDocs et la publie sur GitHub Pages à chaque push sur main.
# Prérequis (une fois) : Settings > Pages > Source : « GitHub Actions ».
name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:          # lancement manuel depuis l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: |
          pip install -r doc/requirements.txt
          pip install .
      - name: Exemples de la doc à jour avec examples/
        run: python tools/exemples_doc.py --check
      - name: Construction (strict)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
