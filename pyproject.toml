[tool.poetry]
name = "pypmsi"
version = "0.3.1"
description = "parser for french PMSI files in python / pola.rs"
authors = ["GuillaumePressiat <guillaume.pressiat@chu-brest.fr>"]
license = "AGPL3"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
polars = "^1.16.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6,<2"
mkdocs-material = "^9.5"
